# This GitHub workflow deploys Bundle resources (ML resource config and more)
# defined under mlops_stacks_april2025/resources/*
# and mlops_stacks_april2025/databricks.yml with prod deployment target configs,
# when PRs are merged into the release branch
name: Bundle Deployment for mlops_stacks_april2025 Prod

on:
  push:
    branches:
      - 'release'
  workflow_dispatch:

defaults:
  run:
    working-directory: ./mlops_stacks_april2025

env:
  DATABRICKS_HOST: https://adb-984752964297111.11.azuredatabricks.net
  DATABRICKS_CLIENT_ID: ${{secrets.STAGING_AZURE_SP_APPLICATION_ID}}
  DATABRICKS_CLIENT_SECRET: ${{secrets.STAGING_AZURE_SP_CLIENT_SECRET}}
  

jobs:
  prod:
    concurrency: mlops_stacks_april2025-prod-bundle-job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@v0.236.0
      - name: Validate Bundle For Prod
        id: validate
        run: |
          databricks bundle validate -t prod
      - name: Deploy Bundle to Prod
        id: deploy
        run: |
          databricks bundle deploy -t prod
